<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">sequence-map hex sticker</title>
  <desc id="desc">Hexagon package sticker showing a geographic surface, sampling network, and DNA motif.</desc>
  <defs>
    <linearGradient id="border" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#38c4d6"/>
      <stop offset="1" stop-color="#0e7c90"/>
    </linearGradient>
    <linearGradient id="mapgrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f15a3c"/>
      <stop offset="0.28" stop-color="#f7c85b"/>
      <stop offset="0.55" stop-color="#9bd48b"/>
      <stop offset="0.78" stop-color="#39b8c6"/>
      <stop offset="1" stop-color="#246fb8"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#173a59"/>
      <stop offset="1" stop-color="#071e35"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <polygon points="400,35 710,215 710,585 400,765 90,585 90,215" fill="url(#border)" filter="url(#shadow)"/>
  <polygon points="400,72 678,234 678,566 400,728 122,566 122,234" fill="url(#bg)"/>

