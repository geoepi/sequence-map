    <path d="M135 440 C240 390 310 445 420 405 S555 350 665 420"/>
    <path d="M175 610 C265 555 340 620 445 585 S590 535 650 575"/>
  </g>

  <text x="400" y="172" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f7fbff" letter-spacing="1">sequence-map</text>

  <g transform="translate(0 5)">
    <path d="M158 375 C178 300 228 270 296 292 C344 237 420 260 454 302 C515 278 604 304 635 366 C683 386 672 465 615 481 C588 545 488 536 452 502 C389 543 312 520 282 476 C218 493 144 456 158 375 Z" fill="url(#mapgrad)" stroke="#f8f5d6" stroke-width="3" opacity="0.96"/>
    <g opacity="0.22" fill="none" stroke="#fff" stroke-width="5">
      <path d="M175 378 C245 330 328 360 395 327 C470 292 548 322 625 363"/>
      <path d="M190 430 C260 390 345 425 420 390 C492 357 565 390 628 424"/>
