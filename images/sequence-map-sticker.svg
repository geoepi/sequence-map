      <line x1="78" y1="33" x2="78" y2="65" stroke="#f7c85b"/>
      <line x1="112" y1="41" x2="112" y2="75" stroke="#f7e47e"/>
      <line x1="184" y1="34" x2="184" y2="66" stroke="#9bd48b"/>
