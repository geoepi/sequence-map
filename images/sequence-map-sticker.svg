    <g stroke="#f7fbff" stroke-width="4" stroke-linecap="round" opacity="0.78">
      <line x1="240" y1="360" x2="355" y2="455"/>
      <line x1="240" y1="360" x2="435" y2="365"/>
      <line x1="355" y1="455" x2="435" y2="365"/>
      <line x1="435" y1="365" x2="525" y2="448"/>
      <line x1="525" y1="448" x2="615" y2="393"/>
      <line x1="435" y1="365" x2="615" y2="393"/>
      <line x1="355" y1="455" x2="525" y2="448"/>
    </g>
    <g fill="#f7fbff" stroke="#d9ffff" stroke-width="3">
      <circle cx="240" cy="360" r="13"/>
      <circle cx="355" cy="455" r="13"/>
      <circle cx="435" cy="365" r="13"/>
      <circle cx="525" cy="448" r="13"/>
      <circle cx="615" cy="393" r="13"/>
